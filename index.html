<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quelli Sgranati</title>
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quelli Sgranati">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna con barra schede in basso; fondo a "tavoletta forata" come le basi Hama */
:root{
  --bg:#eef1f5; --peg:#d9dee7; --surface:#ffffff; --surface-2:#f6f8fb;
  --ink:#1b2231; --muted:#5b6577; --line:#dde2ea;
  --accent:#ff5b2e; --accent-ink:#ffffff; --ok:#13865f; --warn:#b4570a; --danger:#c62f3a;
  --mini:#f2b400; --piccoli:#14a487; --medi:#e2457c; --grandi:#3e6cf0;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; --tabs-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --peg:#1d222c; --surface:#1a1f29; --surface-2:#212733;
  --ink:#eef1f6; --muted:#9aa3b4; --line:#2b3240;
  --accent:#ff6a3d; --accent-ink:#1a0d07; --ok:#3ccf98; --warn:#f0a049; --danger:#ff6b74;
  --mini:#ffc928; --piccoli:#2cc6a5; --medi:#f0679a; --grandi:#6a8fff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --peg:#1d222c; --surface:#1a1f29; --surface-2:#212733;
  --ink:#eef1f6; --muted:#9aa3b4; --line:#2b3240;
  --accent:#ff6a3d; --accent-ink:#1a0d07; --ok:#3ccf98; --warn:#f0a049; --danger:#ff6b74;
  --mini:#ffc928; --piccoli:#2cc6a5; --medi:#f0679a; --grandi:#6a8fff; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--peg) 2.2px, transparent 2.6px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* Testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.beadrow{display:flex;gap:3px}
.logo{height:34px;width:auto;display:block}
.sync{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)} .sync.warn{color:var(--warn)}

/* Perlina */
.bead{--c:var(--accent);width:var(--s,14px);height:var(--s,14px);border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,var(--surface) 0 27%,transparent 29%),radial-gradient(circle at 32% 30%,rgba(255,255,255,.55) 0 12%,transparent 30%),var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.c-set{--c:var(--accent)} .c-extra{--c:var(--muted)} .c-mini{--c:var(--mini)} .c-piccoli{--c:var(--piccoli)} .c-medi{--c:var(--medi)} .c-grandi{--c:var(--grandi)}

/* Barra mercatino */
.market{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-top:4px}
.market-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.market-name{background:none;border:0;padding:0;text-align:left;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.market-name strong{display:block;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.market-name strong::after{content:" ✎";color:var(--muted);font-weight:500}
.total{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em;text-align:right}
.total small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px}
.banner{font-size:14px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

h2{font-family:var(--display);font-weight:800;font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 10px}

/* Vendita rapida per taglia */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.quick{grid-template-columns:repeat(5,minmax(0,1fr))}}
.qbtn.custom{grid-column:1/-1;min-height:60px;flex-direction:row;align-items:center;border-style:dashed}
@media (min-width:560px){.qbtn.custom{grid-column:auto;flex-direction:column;align-items:flex-start;min-height:84px}}
.qbtn.custom .price{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted)}
.qbtn{border:0;border-radius:var(--r);padding:14px 12px;min-height:84px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;position:relative;overflow:hidden;transition:transform .08s}
.qbtn::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.qbtn .row{display:flex;align-items:center;gap:8px;font-weight:700}
.qbtn .price{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.qbtn:active,.tile:active{transform:scale(.96)}

/* Filtri e griglia creazioni */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .08s}
.tile .ph{aspect-ratio:1/1;width:100%;max-width:100%;flex:none;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.tile .ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.tile .ph .bead{--s:46px}
.tile .meta{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tile .meta .tipo{margin-bottom:0;align-self:flex-start}
.tile .meta .tipo.vuoto{visibility:hidden}
.tile .name{font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.tile .pr{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;margin-top:auto}
.tile .pr b{color:var(--ink);font-size:16px}
.badge{position:absolute;top:8px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.badge.l{left:8px} .badge.r{right:8px}
.badge.sold{background:var(--ink);color:var(--bg)}
.badge.out{background:var(--danger);color:#fff}
.badge.low{background:var(--warn);color:#fff}
.tile.is-out .ph{opacity:.45}
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.empty{text-align:center;color:var(--muted);padding:22px 16px;display:grid;gap:10px;justify-items:center}
.empty .beadrow .bead{--s:18px}

/* Pulsanti */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.block{width:100%}

/* Conto cliente + toast */
.cliente{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px 8px}
.cliente-in{max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cliente-in .t{flex:1;min-width:0}
.cliente-in .t small{display:block;font-size:12px;opacity:.75;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cliente-in .t b{font-family:var(--display);font-size:22px;font-weight:800}
.cliente-in .btn{background:var(--bg);color:var(--ink);border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);z-index:20;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:12px;width:min(92vw,440px);font-weight:600}
.toast span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast .btn{color:var(--accent)}

/* Schede in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabs-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab{position:relative}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.ck-box{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.ck-box[aria-checked="true"]{background:var(--danger);border-color:var(--danger);color:var(--accent-ink)}
.ck-box svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck-box[aria-checked="true"] svg{opacity:1}
.refill-row{border-bottom:1px solid var(--line);padding:10px 0}
.refill-row:last-child{border-bottom:0}
.refill-row .li{border:0;padding:0}
.refill-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;color:inherit}

/* Incassi */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.stat.big{grid-column:1/-1}
.stat.big b{font-size:42px}
.select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:600}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.barrow .lab{display:flex;align-items:center;gap:7px;font-weight:600}
.track{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--c)}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:700;overflow-wrap:anywhere}
.li .grow small{color:var(--muted);font-size:13px}
.li .amt{font-weight:700}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.rank{width:26px;text-align:center;font-family:var(--display);font-weight:800;color:var(--muted)}
.icon-btn{border:0;background:none;padding:8px;border-radius:10px;color:var(--muted)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* Set */
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.mosaic>span{background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.mosaic>span img{width:100%;height:100%;object-fit:cover}
.mosaic .bead{--s:26px}
.mosaic .more{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.old{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:13px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.h2row h2{margin:0}
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative}
.pick .ph{aspect-ratio:1/1;display:grid;place-items:center;background:var(--surface-2)}
.pick .ph img{width:100%;height:100%;object-fit:cover}
.pick .ph .bead{--s:30px}
.pick .nm{font-size:12.5px;font-weight:700;padding:6px 7px;line-height:1.2;overflow-wrap:anywhere}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pick .ck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;font-weight:800;font-size:14px}
.pick[aria-pressed="true"] .ck{display:grid}
.sum{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .fin{font-family:var(--display);font-weight:800;font-size:22px}

/* Spese e bilancio */
.balance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.balance .saldo{font-family:var(--display);font-weight:800;font-size:clamp(38px,12vw,52px);line-height:1;letter-spacing:-.02em}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.io b{display:block;font-family:var(--display);font-weight:800;font-size:22px}
.cat-perline{--c:var(--mini)} .cat-iscrizione{--c:var(--grandi)} .cat-accessori{--c:var(--piccoli)} .cat-altro{--c:var(--muted)}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.seg.cats button{font-size:13px}

/* Tipologia e valore catalogo */
.tipo{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-self:start}
.valore{font-family:var(--display);font-weight:800;font-size:19px;color:var(--ok)}
.valore-note{color:var(--muted);font-size:13px;margin:-6px 0 10px}

/* Catalogo */
.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.prices{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px}
/* Safari iOS dà ai campi data una larghezza minima propria: li riportiamo alla larghezza degli altri campi */
.field{min-width:0}
.input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;min-height:46px;color:var(--ink)}
.input[type="date"]{text-align:center}
.input[type="date"]::-webkit-date-and-time-value{text-align:center;margin:0}
.input[type="date"]::-webkit-datetime-edit{padding:0}
.money{position:relative}
.money .input{padding-left:28px}
.money::before{content:"€";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}

/* Foglio modale */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet-in h3{font-family:var(--display);font-weight:800;font-size:21px;margin:0}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 4px;font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.photo{display:flex;gap:12px;align-items:center}
.photo .thumb{width:72px;height:72px;border-radius:14px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.login-in{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 18px;display:grid;gap:12px;justify-items:center;text-align:center}
.sync{cursor:default}
</style>
</head>

<script>
(function(){
const SIZES=[{k:'mini',l:'Mini'},{k:'piccoli',l:'Piccoli'},{k:'medi',l:'Medi'},{k:'grandi',l:'Grandi'}];
const SIZE_L={...Object.fromEntries(SIZES.map(s=>[s.k,s.l])),set:'Set',extra:'Extra'};
const DEFAULT_SCONTI={mini:1,piccoli:2,medi:2.5,grandi:3};
const DEFAULT_LISTINO={mini:1.5,piccoli:3.5,medi:5,grandi:10};
const COLS=['config','mercati','prodotti','set','vendite','spese'];
const CATS=[{k:'perline',l:'Perline'},{k:'iscrizione',l:'Iscrizione mercatino'},{k:'accessori',l:'Accessori'},{k:'altro',l:'Altro'}];
const CAT_L=Object.fromEntries(CATS.map(c=>[c.k,c.l]));
const LS='cassa-hama-v1';
const eur=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const fmt=n=>eur.format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=iso=>{if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})};
const timeLabel=ts=>new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const parseMoney=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?Math.round(n*100)/100:null};

/* ---------- Stato locale ---------- */
let S={config:{},mercati:{},prodotti:{},set:{},vendite:{},spese:{}};
try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);COLS.forEach(c=>{if(p[c])S[c]=p[c]})}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const live=c=>Object.values(S[c]).filter(x=>!x.del);
const cfg=()=>S.config.app||{id:'app',listino:{...DEFAULT_LISTINO},mercatoId:null,u:0};
const listino=()=>({...DEFAULT_LISTINO,...(cfg().listino||{})});
function put(c,obj){obj.u=Date.now();S[c][obj.id]=obj;save();schedulePush()}
function setCfg(patch){put('config',{...cfg(),...patch,id:'app'})}
const mercatoAttuale=()=>{const id=cfg().mercatoId;const m=id&&S.mercati[id];return m&&!m.del?m:null};
function apriMercato(nome,data){const m={id:uid(),nome:nome||'Mercatino',data:data||todayISO()};put('mercati',m);setCfg({mercatoId:m.id});return m}
const venditeDi=mid=>live('vendite').filter(v=>v.mercatoId===mid).sort((a,b)=>b.ts-a.ts);
const somma=arr=>Math.round(arr.reduce((s,v)=>s+(v.prezzo||0),0)*100)/100;
function rimasti(p){if(p.scorta==null||p.scorta==='')return null;const sold=live('vendite').filter(v=>(v.prodottoId===p.id||(v.items||[]).includes(p.id))&&v.ts>=(p.scortaDal||0)).length;return p.scorta-sold}
const sconti=()=>({...DEFAULT_SCONTI,...(cfg().sconti||{})});
const scontoModo=()=>cfg().scontoModo||'max';
// Prezzo di un set: somma dei pezzi meno lo sconto per taglia (modo: 'taglia' = una volta per ogni taglia presente, 'pezzo' = per ogni pezzo, 'max' = solo la taglia più grande)
function setInfo(st){
  const pezzi=(st.items||[]).map(id=>S.prodotti[id]).filter(p=>p&&!p.del);
  const somma=Math.round(pezzi.reduce((a,p)=>a+(p.prezzo||0),0)*100)/100;
  const sc=sconti();const modo=scontoModo();let sconto=0;
  if(modo==='pezzo')sconto=pezzi.reduce((a,p)=>a+(sc[p.taglia]||0),0);
  else if(modo==='max'){const ord=SIZES.map(s=>s.k);const big=pezzi.reduce((b,p)=>ord.indexOf(p.taglia)>ord.indexOf(b)?p.taglia:b,null);sconto=big?sc[big]:0}
  else sconto=[...new Set(pezzi.map(p=>p.taglia))].reduce((a,k)=>a+(sc[k]||0),0);
  sconto=Math.round(sconto*100)/100;
  const auto=Math.max(0,Math.round((somma-sconto)*100)/100);
  const prezzo=st.prezzoFisso!=null?st.prezzoFisso:auto;
  return {pezzi,somma,sconto,auto,prezzo};
}
function mosaic(pezzi){const shown=pezzi.slice(0,pezzi.length>4?3:4);let h='<span class="mosaic">';shown.forEach(p=>{h+='<span>'+imgOr(p,26)+'</span>'});if(pezzi.length>4)h+='<span class="more">+'+(pezzi.length-3)+'</span>';for(let i=shown.length+(pezzi.length>4?1:0);i<4;i++)h+='<span></span>';return h+'</span>'}

/* ---------- Sincronizzazione (db condiviso tra i due telefoni) ---------- */
let db=null,readOnly=false,pushing=false,netErr=false,pushTimer=null;
const remoteU={config:{},mercati:{},prodotti:{},set:{},vendite:{},spese:{}};
const synced={config:false,mercati:false,prodotti:false,set:false,vendite:false,spese:false};
function pendingCount(){let n=0;COLS.forEach(c=>{for(const id in S[c]){if((remoteU[c][id]??-1)<S[c][id].u)n++}});return n}
function updateSync(){
  const el=document.getElementById('sync');
  if(!db){el.textContent=fbAuth?'Non collegato':'Solo su questo telefono';el.className='sync';el.onclick=fbAuth?showLogin:null;return}
  el.onclick=null;
  if(readOnly){el.textContent='Sola lettura';el.className='sync warn';return}
  const ready=COLS.every(c=>synced[c]);const n=pendingCount();
  if(!ready){el.textContent='Collegamento…';el.className='sync';return}
  if(n>0){el.textContent=netErr?('Offline · '+n+' da inviare'):'Invio…';el.className='sync warn';return}
  el.textContent='Sincronizzato';el.className='sync ok';
}
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(push,250);updateSync()}
async function push(){
  if(!db||pushing||readOnly)return;pushing=true;let failed=false;
  try{
    for(const c of COLS){if(!synced[c])continue;
      for(const id of Object.keys(S[c])){const l=S[c][id];if((remoteU[c][id]??-1)>=l.u)continue;
        try{await db.collection(c).doc(id).set(l);remoteU[c][id]=l.u}
        catch(e){if(e&&e.code==='invalid_argument'&&!l.foto){readOnly=true}failed=true;break}
      }
      if(failed)break;
    }
  }finally{pushing=false;netErr=failed;updateSync();
    if(!readOnly&&pendingCount()>0)pushTimer=setTimeout(push,failed?15000:300)}
}
function onSnap(c,snap){
  let changed=false;
  for(const d of snap.docs){const r=d.data();if(!r)continue;const ru=r.u||0;remoteU[c][d.id]=ru;
    const l=S[c][d.id];if(!l||ru>(l.u||0)){S[c][d.id]={...r,id:d.id};changed=true}}
  if(!snap.metadata.fromCache)synced[c]=true;
  if(changed){save();render()}
  schedulePush();
}
/* Firebase: login con email e password, poi stessa sincronizzazione di prima su Firestore */
let fbAuth=null,unsubs=[];
function initDb(){
  const cfgFb=window.FIREBASE_CONFIG;
  if(!cfgFb||!window.firebase){updateSync();return}
  firebase.initializeApp(cfgFb);
  fbAuth=firebase.auth();
  const fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  fbAuth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];
    COLS.forEach(c=>{synced[c]=false;remoteU[c]={}});
    if(!u){db=null;updateSync();showLogin();return}
    hideLogin();db=fs;readOnly=false;updateSync();
    COLS.forEach(c=>{unsubs.push(db.collection(c).onSnapshot({includeMetadataChanges:true},s=>onSnap(c,s),e=>{if(e&&e.code==='permission-denied'){readOnly=true}updateSync()}))});
  });
  window.addEventListener('online',schedulePush);
}

function importa(file){
  const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('File non valido');return}
    let n=0;COLS.forEach(c=>{const col=d[c];if(!col||typeof col!=='object')return;
      Object.values(col).forEach(x=>{if(!x||!x.id)return;const l=S[c][x.id];if(!l||(x.u||0)>(l.u||0)){S[c][x.id]={...x,u:Math.max(x.u||0,Date.now())};n++}})});
    save();schedulePush();render();toast(n?('Importati '+n+' elementi'):'Niente di nuovo da importare')};

let cliente=[],clienteTimer=null,toastTimer=null;
function vendi({prodottoId=null,setId=null,items=null,nome,taglia,prezzo,mercatoId=null}){
  let m=mercatoId?S.mercati[mercatoId]:mercatoAttuale();if(!m)m=apriMercato();
  const v={id:uid(),prodottoId,nome,taglia,prezzo,ts:mercatoId?tsPosteriori(m):Date.now(),mercatoId:m.id};if(setId){v.setId=setId;v.items=items}
  if(mercatoId)v.dopo=true;
  put('vendite',v);
  if(!mercatoId){cliente.push(v.id);resetClienteTimer()}
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  toast('Venduto: '+nome+' · '+fmt(prezzo),()=>annulla(v.id));
  render();

}
// Orario per una vendita aggiunta dopo: adesso se il mercatino è di oggi, altrimenti subito dopo l'ultima vendita (o mezzogiorno del giorno del mercatino)
function tsPosteriori(m){
  if(!m.data||m.data===todayISO())return Date.now();
  const last=Math.max(0,...venditeDi(m.id).map(v=>v.ts||0));
  if(last)return last+60000;
  const d=new Date(m.data+'T12:00:00');return isNaN(d)?Date.now():d.getTime();
}

function viewCatalogo(){

  h+='<p class="valore-note">Valore dei '+pezziTot+(pezziTot===1?' pezzo disponibile':' pezzi disponibili')+' a prezzo di vendita'+(senza?'. '+senza+(senza===1?' creazione senza pezzi indicati non è contata':' creazioni senza pezzi indicati non sono contate'):'')+'.</p>';

    h+='</div>'}

  else h+='<div class="card empty" style="margin-top:12px">Ancora nessuna creazione. Aggiungetele con una foto: al banco le riconoscete al volo.</div>';
  const idsF=new Set(prods.map(p=>p.id));

  if(sets.length){h+='<h2>Set</h2><div class="card list">';
    sets.forEach(st=>{const i=setInfo(st);const tot=live('vendite').filter(v=>v.setId===st.id).length;
      h+='<button class="li" style="border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%" data-editset="'+esc(st.id)+'"><span class="thumb" style="position:relative">'+mosaic(i.pezzi)+'</span><div class="grow"><b>'+esc(st.nome)+'</b><small class="num">'+i.pezzi.length+' pezzi · '+fmt(i.prezzo)+(i.somma>i.prezzo?' invece di '+fmt(i.somma):'')+' · venduti '+tot+'</small></div><span class="icon-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>'});

  h+='</div>';
  const SC=sconti();
  h+='<h2>Sconto sui set</h2><p class="sub">Si toglie dalla somma dei pezzi lo sconto della taglia più grande presente nel set.</p><div class="card prices">';
  SIZES.forEach(s=>{h+='<div class="field"><label for="sc-'+s.k+'" style="display:flex;gap:6px;align-items:center">'+bead(s.k,13)+s.l+'</label><div class="money"><input class="input num" id="sc-'+s.k+'" data-sconto="'+s.k+'" inputmode="decimal" value="'+String(SC[s.k]).replace('.',',')+'"></div></div>'});
  h+='</div>';
  h+='<h2>Dati e account</h2><p class="sub">Un file con tutto (catalogo, vendite, spese): utile come copia di sicurezza o per trasferire i dati.</p><div class="card" style="display:grid;gap:10px"><div class="row-btns"><button class="btn" id="dEsporta">Esporta i dati</button><label class="btn" for="dImporta" style="text-align:center">Importa da file</label><input id="dImporta" type="file" accept="application/json,.json" hidden></div>'+
    (fbAuth&&fbAuth.currentUser?'<p class="hint" style="margin:0">Collegati come '+esc(fbAuth.currentUser.email||'')+'</p><div><button class="btn ghost sm" id="dEsci" style="color:var(--danger)">Esci da questo telefono</button></div>':(fbAuth?'<div><button class="btn sm" id="dEntra">Entra con email e password</button></div>':''))+'</div>';
  return h;
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  {const n=esaurite().length,t=document.querySelector('.tab[data-tab="refill"]');let bd=t.querySelector('.badge');if(n){if(!bd){bd=document.createElement('span');bd.className='badge num';t.appendChild(bd)}bd.textContent=n}else if(bd)bd.remove()}
  const active=document.activeElement&&document.activeElement.id;
  const caret=(active==='cerca'||active==='cercaCat')?document.activeElement.selectionStart:null;
  view.innerHTML=tab==='vendi'?viewVendi():tab==='incassi'?viewIncassi():tab==='spese'?viewSpese():tab==='refill'?viewRefill():viewCatalogo();
  if(active==='cerca'||active==='cercaCat'){const i=document.getElementById(active);if(i){i.focus();try{i.setSelectionRange(caret,caret)}catch(e){}}}
  renderCliente();updateSync();
}

  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.quick){const k=t.dataset.quick;vendi({nome:'Pezzo '+SIZE_L[k],taglia:k,prezzo:listino()[k]});flash(t);return}
  if(t.dataset.sell){const p=S.prodotti[t.dataset.sell];if(!p)return;vendi({prodottoId:p.id,nome:p.nome,taglia:p.taglia,prezzo:p.prezzo});const n=view.querySelector('[data-sell="'+CSS.escape(p.id)+'"]');if(n)flash(n);return}
  if(t.dataset.sellset){const st=S.set[t.dataset.sellset];if(!st)return;const i=setInfo(st);if(!i.pezzi.length)return;vendi({setId:st.id,nome:st.nome,taglia:'set',prezzo:i.prezzo,items:i.pezzi.map(p=>p.id)});const n=view.querySelector('[data-sellset="'+CSS.escape(st.id)+'"]');if(n)flash(n);return}
  if(t.dataset.newset){openSet(null);return}
  if(t.dataset.editset){openSet(S.set[t.dataset.editset]);return}
  if(t.dataset.refck){confirmRefill=confirmRefill===t.dataset.refck?null:t.dataset.refck;render();return}
  if(t.dataset.reftogli){const p=S.prodotti[t.dataset.reftogli];if(p){put('prodotti',{...p,refill:false});render();toast('Tolta da Refill',()=>{put('prodotti',{...S.prodotti[p.id],refill:true});render()})}return}
  if(t.id==='refAdd'){openRefillAdd();return}
  if(t.dataset.refno){confirmRefill=null;render();return}
  if(t.dataset.refok){const p=S.prodotti[t.dataset.refok];confirmRefill=null;if(p){put('prodotti',{...p,del:true});toast('Creazione eliminata',()=>{put('prodotti',{...p,del:false});render()})}render();return}
  if(t.id==='addVendita'){openAggiungiVendita(selMercato);return}
  if(t.id==='mEdit'){openModificaMercato(selMercato);return}
  if(t.id==='mDelAsk'){confirmMerc=selMercato;render();return}
  if(t.id==='mDelNo'){confirmMerc=null;render();return}
  if(t.id==='mDelOk'){eliminaMercato(confirmMerc);return}
  if(t.dataset.ftipo){filtroTipo=t.dataset.ftipo;render();return}
  if(t.dataset.periodo){periodo=t.dataset.periodo;render();return}

  if(t.dataset.askdel){confirmDel=t.dataset.askdel;render();return}

  if(t.dataset.edit){openProdotto(S.prodotti[t.dataset.edit]);return}
  if(t.id==='editMercato'){openMercato();return}
  if(t.id==='nuovoOggi'){apriMercato();render();toast('Aperto il mercatino di oggi');return}
  if(t.id==='nuovaCreazione'){openProdotto(null);return}

  if(t.id==='dEsporta'){esporta();return}
  if(t.id==='dEsci'){esci();return}
  if(t.id==='dEntra'){showLogin();return}

      '<div class="field"><label for="pTipo">Tipologia</label><input class="input" id="pTipo" list="tipiList" value="'+esc(st.tipo||'')+'" placeholder="Es. Portachiavi, Calamita, Quadretto" autocomplete="off"><datalist id="tipiList">'+tipi.map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist></div>'+
      '<div class="field"><span class="flabel">Taglia</span><div class="seg">'+SIZES.map(s=>'<button class="c-'+s.k+'" data-tg="'+s.k+'" aria-pressed="'+(st.taglia===s.k)+'">'+bead(s.k,16)+s.l+'</button>').join('')+'</div></div>'+
      '<div class="prices" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label for="pPrezzo">Prezzo</label><div class="money"><input class="input num" id="pPrezzo" inputmode="decimal" value="'+String(st.prezzo).replace('.',',')+'"></div></div><div class="field"><label for="pScorta">Pezzi disponibili</label><input class="input num" id="pScorta" inputmode="numeric" placeholder="Facoltativo" value="'+(st.scorta!=null&&st.scorta!==''?esc(isNew?st.scorta:(rimasti(p)??st.scorta)):'')+'"></div></div>'+
      '<p class="hint">Con i pezzi disponibili l’app scala la scorta a ogni vendita e vi avvisa quando finiscono.</p>'+
      '<div class="row-btns">'+(isNew?'':(askDel?'<button class="btn danger" id="pDelOk">Elimina davvero</button>':'<button class="btn ghost" id="pDel" style="color:var(--danger)">Elimina</button>'))+'<button class="btn" id="pChiudi">Annulla</button><button class="btn primary" id="pSalva">Salva</button></div>',
    el=>{
      const nome=el.querySelector('#pNome');const pr=el.querySelector('#pPrezzo');const sc=el.querySelector('#pScorta');
      const tp=el.querySelector('#pTipo');
      const keep=()=>{st.nome=nome.value;st.tipo=tp.value;const n=parseMoney(pr.value);if(n!=null)st.prezzo=n;st._sc=sc.value};
      if(st._sc!=null)sc.value=st._sc;
      pr.addEventListener('input',()=>{prezzoToccato=true});
      el.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{keep();st.taglia=b.dataset.tg;if(!prezzoToccato)st.prezzo=L[st.taglia];draw()});
      el.querySelector('#pFoto').onchange=async ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;keep();try{st.foto=await resize(f,240)}catch(e){toast('Non riesco a leggere questa foto')}draw()};
      const nf=el.querySelector('#pNoFoto');if(nf)nf.onclick=()=>{keep();st.foto=null;draw()};
      el.querySelector('#pChiudi').onclick=closeSheet;
      const d1=el.querySelector('#pDel');if(d1)d1.onclick=()=>{keep();askDel=true;draw()};
      const d2=el.querySelector('#pDelOk');if(d2)d2.onclick=()=>{put('prodotti',{...p,del:true});closeSheet();render();toast('Creazione eliminata',()=>{put('prodotti',{...p,del:false});render()})};
      el.querySelector('#pSalva').onclick=()=>{
        keep();const n=st.nome.trim();if(!n){nome.focus();nome.placeholder='Scrivi un nome';return}
        const prezzo=parseMoney(pr.value);if(prezzo==null){pr.focus();return}
        const scRaw=String(st._sc??'').trim();const scorta=scRaw===''?null:Math.max(0,parseInt(scRaw,10)||0);
        const out={id:st.id,nome:n,tipo:(st.tipo||'').trim(),taglia:st.taglia,prezzo,foto:st.foto||null,scorta,scortaDal:scorta==null?null:Date.now(),creato:st.creato||Date.now()};
        // Resta in Refill (aggiunta a mano) finché non cambiate il numero di pezzi
        if(p&&p.refill&&scorta===(p.scorta??null))out.refill=true;
        put('prodotti',out);closeSheet();render();toast(isNew?'Creazione aggiunta':'Creazione salvata');
      };
      if(isNew&&!st.nome)setTimeout(()=>nome.focus(),50);
    });
  };
  draw();
}
const sommaSpese=arr=>Math.round(arr.reduce((a,x)=>a+(x.importo||0),0)*100)/100;
const segno=n=>(n<0?'− ':n>0?'+ ':'')+fmt(Math.abs(n));
let periodo='sempre';
function inPeriodo(ts){if(periodo==='sempre')return true;const d=new Date(ts),n=new Date();if(periodo==='anno')return d.getFullYear()===n.getFullYear();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()}
const isoTs=iso=>{if(!iso)return 0;const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
function viewSpese(){
  const entr=somma(live('vendite').filter(v=>inPeriodo(v.ts)));
  const spese=live('spese').filter(x=>inPeriodo(isoTs(x.data))).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.u-a.u);
  const usc=sommaSpese(spese);const saldo=Math.round((entr-usc)*100)/100;
  let h='<h2>Spese e bilancio</h2><div class="chips" style="margin-bottom:10px">';
  [['sempre','Da sempre'],['anno','Quest’anno'],['mese','Questo mese']].forEach(([k,l])=>{h+='<button class="chip" data-periodo="'+k+'" aria-pressed="'+(periodo===k)+'">'+l+'</button>'});
  h+='</div><section class="balance"><div><span class="eyebrow">'+(saldo<0?'Siete in perdita':saldo>0?'Siete in attivo':'In pari')+'</span><div class="saldo num '+(saldo<0?'neg':'pos')+'">'+segno(saldo)+'</div></div><div class="io num"><div><span class="eyebrow">Entrato</span><b>'+fmt(entr)+'</b></div><div><span class="eyebrow">Uscito</span><b>'+fmt(usc)+'</b></div></div></section>';
  h+='<div style="margin-top:12px"><button class="btn primary block" id="nuovaSpesa">+ Nuova spesa</button></div>';
  if(!spese.length){h+='<div class="card empty" style="margin-top:12px">Nessuna spesa '+(periodo==='sempre'?'registrata':'in questo periodo')+'. Segnate qui perline, iscrizioni ai mercatini e accessori: il bilancio in alto si aggiorna da solo.</div>';return h}
  const per={};CATS.forEach(c=>per[c.k]=0);spese.forEach(x=>{per[x.categoria in per?x.categoria:'altro']+=x.importo||0});
  const maxE=Math.max(1,...CATS.map(c=>per[c.k]));
  h+='<h2>Per categoria</h2><div class="card bars">';
  CATS.forEach(c=>{h+='<div class="barrow cat-'+c.k+'" style="grid-template-columns:118px minmax(0,1fr) auto"><span class="lab"><i class="dot"></i>'+(c.k==='iscrizione'?'Iscrizioni':c.l)+'</span><div class="track"><div class="fill" style="width:'+(per[c.k]/maxE*100).toFixed(1)+'%"></div></div><span class="num">'+fmt(per[c.k])+'</span></div>'});
  h+='</div><h2>Elenco spese</h2><div class="card list">';
  spese.forEach(x=>{const m=x.mercatoId&&S.mercati[x.mercatoId];h+='<button class="li cat-'+esc(x.categoria)+'" style="border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%" data-editspesa="'+esc(x.id)+'"><i class="dot"></i><div class="grow"><b>'+esc(x.descrizione||CAT_L[x.categoria])+'</b><small>'+esc(dayLabel(x.data))+' · '+esc(CAT_L[x.categoria]||'Altro')+(m?' · '+esc(m.nome):'')+'</small></div><span class="amt num neg">− '+fmt(x.importo)+'</span></button>'});
  return h+'</div>';
}
function openSpesa(orig){
  const isNew=!orig;let st=orig?{...orig}:{id:uid(),descrizione:'',importo:null,categoria:'perline',data:todayISO(),mercatoId:null};let askDel=false;
  const mercati=live('mercati').sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const draw=()=>{
    openSheet('<h3>'+(isNew?'Nuova spesa':'Modifica spesa')+'</h3>'+
      '<div class="field"><label for="xImp">Importo</label><div class="money"><input class="input num" id="xImp" inputmode="decimal" value="'+(st.importo!=null?String(st.importo).replace('.',','):'')+'" placeholder="0,00"></div></div>'+
      '<div class="field"><span class="flabel">Categoria</span><div class="seg cats">'+CATS.map(c=>'<button class="cat-'+c.k+'" data-cat="'+c.k+'" aria-pressed="'+(st.categoria===c.k)+'"><i class="dot"></i>'+(c.k==='iscrizione'?'Iscrizione':c.l)+'</button>').join('')+'</div></div>'+
      '<div class="field"><label for="xDesc">Descrizione</label><input class="input" id="xDesc" value="'+esc(st.descrizione)+'" placeholder="'+({perline:'Es. 10.000 perline Hama, Amazon',iscrizione:'Es. Iscrizione Fiera di Novara',accessori:'Es. Portachiavi e calamite, Shein',altro:'Es. Gazebo, sacchetti'}[st.categoria])+'" autocomplete="off"></div>'+
      '<div class="field"><label for="xData">Data</label><input class="input" id="xData" type="date" value="'+esc(st.data)+'"></div>'+
      '<div class="field"><label for="xMerc">Collega a un mercatino (facoltativo)</label><select class="select" id="xMerc"><option value="">Nessuno</option>'+mercati.map(m=>'<option value="'+esc(m.id)+'"'+(st.mercatoId===m.id?' selected':'')+'>'+esc(m.nome)+' · '+esc(dayLabel(m.data))+'</option>').join('')+'</select><span class="hint">Così in Incassi vedete il netto di quel mercatino.</span></div>'+
      '<div class="row-btns">'+(isNew?'':(askDel?'<button class="btn danger" id="xDelOk">Elimina davvero</button>':'<button class="btn ghost" id="xDel" style="color:var(--danger)">Elimina</button>'))+'<button class="btn" id="xChiudi">Annulla</button><button class="btn primary" id="xSalva">Salva</button></div>',
    el=>{
      const imp=el.querySelector('#xImp'),desc=el.querySelector('#xDesc'),dt=el.querySelector('#xData'),mc=el.querySelector('#xMerc');
      const keep=()=>{st.importo=parseMoney(imp.value);st.descrizione=desc.value;st.data=dt.value||todayISO();st.mercatoId=mc.value||null};
      el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{keep();st.categoria=b.dataset.cat;if(st.categoria==='iscrizione'&&!st.mercatoId){const m=mercatoAttuale();if(m)st.mercatoId=m.id}draw()});
      el.querySelector('#xChiudi').onclick=closeSheet;
      const d1=el.querySelector('#xDel');if(d1)d1.onclick=()=>{keep();askDel=true;draw()};
      const d2=el.querySelector('#xDelOk');if(d2)d2.onclick=()=>{put('spese',{...orig,del:true});closeSheet();render();toast('Spesa eliminata',()=>{put('spese',{...orig,del:false});render()})};
      el.querySelector('#xSalva').onclick=()=>{keep();if(!st.importo){imp.focus();return}
        put('spese',{id:st.id,descrizione:st.descrizione.trim(),importo:st.importo,categoria:st.categoria,data:st.data,mercatoId:st.mercatoId});closeSheet();render();toast(isNew?'Spesa aggiunta':'Spesa salvata')};
      if(isNew&&st.importo==null)setTimeout(()=>imp.focus(),50);
    });
  };
  draw();
}
function eliminaMercato(id){
  const m=S.mercati[id];if(!m)return;
  const vend=live('vendite').filter(v=>v.mercatoId===id);const sp=live('spese').filter(x=>x.mercatoId===id);
  vend.forEach(v=>put('vendite',{...v,del:true}));
  sp.forEach(x=>put('spese',{...x,mercatoId:null}));
  put('mercati',{...m,del:true});
  const eraAttuale=cfg().mercatoId===id;if(eraAttuale)setCfg({mercatoId:null});
  cliente=cliente.filter(cid=>!vend.some(v=>v.id===cid));
  confirmMerc=null;selMercato=null;render();
  toast('Mercatino “'+m.nome+'” eliminato',()=>{put('mercati',{...m,del:false});vend.forEach(v=>put('vendite',{...S.vendite[v.id],del:false}));sp.forEach(x=>put('spese',{...S.spese[x.id],mercatoId:id}));if(eraAttuale)setCfg({mercatoId:id});selMercato=id;render()});
}
function openPersonalizza(mercatoId=null){
  const recenti=[];const seen=new Set();
  live('vendite').filter(v=>v.taglia==='extra').sort((a,b)=>b.ts-a.ts).forEach(v=>{const k=(v.nome||'').toLowerCase();if(k&&!seen.has(k)&&recenti.length<6){seen.add(k);recenti.push(v)}});
  openSheet('<h3>Vendita personalizzata</h3>'+
    '<div class="field"><label for="cNome">Voce</label><input class="input" id="cNome" placeholder="Es. Portachiavi su richiesta" autocomplete="off"></div>'+
    '<div class="field"><label for="cPrezzo">Prezzo</label><div class="money"><input class="input num" id="cPrezzo" inputmode="decimal" placeholder="0,00"></div></div>'+
    (recenti.length?'<div class="field"><span class="flabel">Usate di recente</span><div class="chips" style="flex-wrap:wrap">'+recenti.map(v=>'<button class="chip" data-rec="'+esc(v.id)+'">'+esc(v.nome)+' · '+fmt(v.prezzo)+'</button>').join('')+'</div></div>':'')+
    '<div class="row-btns"><button class="btn" id="cChiudi">Annulla</button><button class="btn primary" id="cVendi">Registra vendita</button></div>',
  el=>{
    const nome=el.querySelector('#cNome'),pr=el.querySelector('#cPrezzo');
    el.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{const v=S.vendite[b.dataset.rec];if(!v)return;nome.value=v.nome;pr.value=String(v.prezzo).replace('.',',');pr.focus()});
    el.querySelector('#cChiudi').onclick=closeSheet;
    el.querySelector('#cVendi').onclick=()=>{const n=nome.value.trim();if(!n){nome.focus();nome.placeholder='Scrivi cosa avete venduto';return}
      const p=parseMoney(pr.value);if(p==null||pr.value.trim()===''){pr.focus();return}
      closeSheet();vendi({nome:n,taglia:'extra',prezzo:p,mercatoId})};
    setTimeout(()=>nome.focus(),50);
  });
}
function openAggiungiVendita(mercatoId){
  const m=S.mercati[mercatoId];if(!m)return;
  const L=listino();
  const prods=live('prodotti').sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','it'));
  const sets=live('set').map(st=>({st,i:setInfo(st)})).filter(x=>x.i.pezzi.length).sort((a,b)=>(a.st.nome||'').localeCompare(b.st.nome||'','it'));
  let q='';
  const draw=()=>{
    const k=q.trim().toLowerCase();const ok=x=>!k||(x.nome||'').toLowerCase().includes(k)||(x.tipo||'').toLowerCase().includes(k);
    const pp=prods.filter(ok),ss=sets.filter(x=>ok(x.st));
    return '<div class="picker">'+
      pp.map(p=>'<button class="pick" data-addp="'+esc(p.id)+'"><span class="ph">'+imgOr(p,30)+'</span><span class="nm">'+esc(p.nome)+'<br><span class="num" style="color:var(--muted);font-weight:600">'+fmt(p.prezzo)+'</span></span></button>').join('')+
      ss.map(x=>'<button class="pick" data-adds="'+esc(x.st.id)+'"><span class="ph" style="position:relative">'+mosaic(x.i.pezzi)+'</span><span class="nm">'+esc(x.st.nome)+'<br><span class="num" style="color:var(--muted);font-weight:600">Set · '+fmt(x.i.prezzo)+'</span></span></button>').join('')+
      '</div>'+((pp.length||ss.length)?'':'<div class="empty" style="padding:12px 0">Nessuna creazione trovata.</div>');
  };
  openSheet('<h3>Aggiungi vendita</h3><p class="sub" style="margin-top:-4px">In <b>'+esc(m.nome)+' · '+esc(dayLabel(m.data))+'</b>. Toccate quello che avete venduto.</p>'+
    '<div class="field"><span class="flabel">Pezzo generico</span><div class="chips" style="flex-wrap:wrap">'+SIZES.map(s=>'<button class="chip" data-addq="'+s.k+'">'+bead(s.k,13)+' '+s.l+' · '+fmt(L[s.k])+'</button>').join('')+'<button class="chip" id="addPers">Personalizza</button></div></div>'+
    ((prods.length||sets.length)?'<div class="field"><label for="addCerca">Creazioni e set</label><input class="input" id="addCerca" placeholder="Cerca per nome o tipologia" autocomplete="off"></div><div id="addList">'+draw()+'</div>':'')+
    '<div class="row-btns" style="margin-top:14px"><button class="btn" id="addChiudi">Chiudi</button></div>',
  el=>{
    const fatto=v=>{closeSheet();selMercato=mercatoId;render()};
    const bindList=()=>{
      el.querySelectorAll('[data-addp]').forEach(b=>b.onclick=()=>{const p=S.prodotti[b.dataset.addp];if(!p)return;fatto(vendi({prodottoId:p.id,nome:p.nome,taglia:p.taglia,prezzo:p.prezzo,mercatoId}))});
      el.querySelectorAll('[data-adds]').forEach(b=>b.onclick=()=>{const st=S.set[b.dataset.adds];if(!st)return;const i=setInfo(st);if(!i.pezzi.length)return;fatto(vendi({setId:st.id,nome:st.nome,taglia:'set',prezzo:i.prezzo,items:i.pezzi.map(p=>p.id),mercatoId}))});
    };
    bindList();
    el.querySelectorAll('[data-addq]').forEach(b=>b.onclick=()=>{const k=b.dataset.addq;fatto(vendi({nome:'Pezzo '+SIZE_L[k],taglia:k,prezzo:listino()[k],mercatoId}))});
    el.querySelector('#addPers').onclick=()=>{closeSheet();openPersonalizza(mercatoId)};
    el.querySelector('#addChiudi').onclick=closeSheet;
    const c=el.querySelector('#addCerca');if(c)c.oninput=()=>{q=c.value;el.querySelector('#addList').innerHTML=draw();bindList()};
  });
}
function openSet(orig){
  const isNew=!orig;
  let st=orig?{...orig,items:[...(orig.items||[])]}:{id:uid(),nome:'',items:[],prezzoFisso:null};
  let askDel=false;
  const prods=live('prodotti').sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','it'));
  const draw=()=>{
    const i=setInfo(st);
    openSheet('<h3>'+(isNew?'Crea set':'Modifica set')+'</h3>'+
      '<div class="field"><label for="sNome">Nome del set</label><input class="input" id="sNome" value="'+esc(st.nome)+'" placeholder="Es. Sfere del drago + radar" autocomplete="off"></div>'+
      '<div class="field"><span class="flabel">Toccate le creazioni da unire ('+st.items.length+' scelte)</span>'+
      (prods.length?'<div class="picker">'+prods.map(p=>'<button class="pick" data-pick="'+esc(p.id)+'" aria-pressed="'+st.items.includes(p.id)+'"><span class="ph">'+imgOr(p,30)+'</span><span class="nm">'+esc(p.nome)+'<br><span class="old" style="text-decoration:none">'+esc(SIZE_L[p.taglia]||'')+' · '+fmt(p.prezzo)+'</span></span><span class="ck">✓</span></button>').join('')+'</div>':'<p class="hint">Prima aggiungete qualche creazione nel Catalogo.</p>')+'</div>'+
      '<div class="sum num"><div><span>Somma dei pezzi</span><span>'+fmt(i.somma)+'</span></div><div><span>Sconto set</span><span>− '+fmt(i.sconto)+'</span></div><div class="fin"><span>Prezzo del set</span><span>'+fmt(i.prezzo)+'</span></div></div>'+
      '<div class="field"><label for="sFisso">Prezzo a mano (facoltativo)</label><div class="money"><input class="input num" id="sFisso" inputmode="decimal" placeholder="'+String(i.auto).replace('.',',')+' calcolato" value="'+(st.prezzoFisso!=null?String(st.prezzoFisso).replace('.',','):'')+'"></div></div>'+
      '<div class="row-btns">'+(isNew?'':(askDel?'<button class="btn danger" id="sDelOk">Elimina davvero</button>':'<button class="btn ghost" id="sDel" style="color:var(--danger)">Elimina</button>'))+'<button class="btn" id="sChiudi">Annulla</button><button class="btn primary" id="sSalva">Salva set</button></div>',
    el=>{
      const nome=el.querySelector('#sNome');const fx=el.querySelector('#sFisso');
      const keep=()=>{st.nome=nome.value;const raw=fx.value.trim();st.prezzoFisso=raw===''?null:parseMoney(raw)};
      el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{keep();const id=b.dataset.pick;st.items=st.items.includes(id)?st.items.filter(x=>x!==id):[...st.items,id];const y=el.scrollTop;draw();sheet.firstElementChild.scrollTop=y});
      fx.addEventListener('change',()=>{keep();const y=el.scrollTop;draw();sheet.firstElementChild.scrollTop=y});
      el.querySelector('#sChiudi').onclick=closeSheet;
      const d1=el.querySelector('#sDel');if(d1)d1.onclick=()=>{keep();askDel=true;draw()};
      const d2=el.querySelector('#sDelOk');if(d2)d2.onclick=()=>{put('set',{...orig,del:true});closeSheet();render();toast('Set eliminato',()=>{put('set',{...orig,del:false});render()})};
      el.querySelector('#sSalva').onclick=()=>{
        keep();const n=st.nome.trim();if(!n){nome.focus();nome.placeholder='Scrivi un nome';return}
        if(st.items.length<2){toast('Scegliete almeno due creazioni');return}
        put('set',{id:st.id,nome:n,items:st.items,prezzoFisso:st.prezzoFisso??null});closeSheet();render();toast(isNew?'Set creato':'Set salvato');
      };
    });
  };
  draw();
}
function resize(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*s),h=Math.round(img.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)})}

render();
initDb();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
